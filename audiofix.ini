[AudioFix]
; 1 = remove FILE_FLAG_NO_BUFFERING dos pacotes do jogo (a correção). 0 = só observa/loga.
Enabled=1
; 1 = pede ao cache do Windows para manter os dados mapeados (bom para releituras aleatórias)
RandomAccess=1
; 1 = grava audiofix.log na pasta do jogo
Log=1
; intervalo (segundos) das estatísticas no log. 0 = desliga
StatsSeconds=60
; extensões afetadas, separadas por ;
Extensions=.rmdblob
